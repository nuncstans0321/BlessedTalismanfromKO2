<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>～終極2組🧧絕對保護～</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgm" loop src="assets/bgm.mp3"></audio>
    <audio id="drawSfx" src="assets/draw.mp3"></audio>

    <div id="card-container">
        <section id="scene-1" class="scene active">
            <div class="photo-frame">
                <img src="assets/intro.jpg" alt="記憶照片" id="intro-photo">
            </div>
            <button class="action-btn" onclick="nextScene(1)">開啟祝福</button>
        </section>

        <section id="scene-2" class="scene">
            <div class="text-bg-container">
                <img src="assets/intro.jpg" alt="背景圖片" class="text-bg-img">
            </div>
            <div id="text-display" class="fade-in-content">
                </div>
            <button class="action-btn" onclick="nextScene(2)">前往求籤</button>
        </section>

        <section id="scene-3" class="scene">
            <div class="temple-ui">
                <div class="tag-selector">
                    <p class="guide-text">請選擇求籤項目</p>
                    <div class="btn-group">
                        <button class="tag-btn" onclick="startDraw('平安')">平安</button>
                        <button class="tag-btn" onclick="startDraw('健康')">健康</button>
                        <button class="tag-btn" onclick="startDraw('事業')">事業</button>
                        <button class="tag-btn" onclick="startDraw('家庭')">家庭</button>
                        <button class="tag-btn" onclick="startDraw('幸福')">幸福</button>
                    </div>
                </div>
                <div class="bucket-box">
                    <img src="assets/container.png" id="main-bucket" alt="籤筒">
                </div>
            </div>
        </section>

        <section id="scene-4" class="scene">
            <div class="end-content">
                <img src="assets/ending.png" alt="感謝" class="end-img">
                <div class="final-btns">
                    <button class="action-btn" onclick="location.reload()">重播一次</button>
                    <button class="action-btn" onclick="shareLink()">分享連結</button>
                </div>
            </div>
        </section>
    </div>

    <div id="card-overlay" class="overlay hidden"
