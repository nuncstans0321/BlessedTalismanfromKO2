<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="1" stop-color="rgba(255,210,120,0.10)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>
  <rect x="70" y="70" width="760" height="1060" rx="46" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="6" filter="url(#shadow)"/>
  <rect x="110" y="150" width="680" height="220" rx="36" fill="url(#bg)" stroke="rgba(255,255,255,0.14)" stroke-width="4"/>
  <text x="450" y="270" text-anchor="middle" font-size="68" fill="rgba(255,255,255,0.92)" font-family="system-ui">家和安泰</text>
  <text x="450" y="470" text-anchor="middle" font-size="26" fill="rgba(255,255,255,0.72)" font-family="system-ui">願你溫暖常伴。</text>
  <rect x="160" y="560" width="580" height="440" rx="32" fill="rgba(0,0,0,0.12)" stroke="rgba(255,255,255,0.10)" stroke-width="3"/>
  <text x="450" y="785" text-anchor="middle" font-size="22" fill="rgba(255,255,255,0.62)" font-family="system-ui">（把這張圖換成你的平安符／卡片圖樣）</text>
</svg>